<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>
        Athlos | AI Athlete Coach
    </title>


    <!-- Main Styles -->

    <link rel="stylesheet" href="./css/style.css">

    <link rel="stylesheet" href="./css/cards.css">

    <link rel="stylesheet" href="./css/chips.css">

    <link rel="stylesheet" href="./css/inputs.css">

    <link rel="stylesheet" href="./css/progress.css">

    <link rel="stylesheet" href="./css/animations.css">


</head>


<body>


<div class="app">


    <!-- =================================
         HEADER
    ================================= -->


    <header class="athlos-header">


        <div class="logo">

            ATHLOS

        </div>


        <div class="tagline">

            AI Athlete Coach

        </div>


    </header>







    <!-- =================================
         PROGRESS
    ================================= -->


    <div class="progress-container">


        <div class="progress-track">


            <div 
            id="progress-bar"
            class="progress-bar">
            </div>


        </div>



        <p class="progress-text">

            Building your athlete profile

        </p>


    </div>







    <!-- =================================
         QUESTION CARD
    ================================= -->


    <main class="container">


        <section class="question-card">


            <h1 id="question-title">

                Loading...

            </h1>



            <p id="question-description">

            </p>





            <div 
            id="options"
            class="options-container">


            </div>





            <button
            id="next-btn"
            class="next-button">


                Continue


            </button>



        </section>


    </main>







    <!-- =================================
         FOOTER
    ================================= -->


    <footer class="athlos-footer">


        <p>

            Powered by Athlos AI

        </p>


    </footer>





</div>






<!-- Application Entry -->

<script 
type="module"
src="./js/script.js">
</script>



</body>

</html>
