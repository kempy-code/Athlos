<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Athlos creates personalised, recovery-aware training programmes with workout tracking and an AI athlete coach.">
    <meta name="theme-color" content="#17171d">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./athlos-mark.svg" type="image/svg+xml">


    <title>
        Athlos | AI Athlete Coach
    </title>



    <!-- =====================================
         CORE CSS
    ===================================== -->


    <link rel="stylesheet" href="./css/style.css">

    <link rel="stylesheet" href="./css/cards.css">

    <link rel="stylesheet" href="./css/chips.css">

    <link rel="stylesheet" href="./css/inputs.css">

    <link rel="stylesheet" href="./css/progress.css">

    <link rel="stylesheet" href="./css/animations.css">
    <link rel="stylesheet" href="./css/auth.css">


    <!-- =====================================
        RESULTS DASHBOARD CSS
    ===================================== -->

    <link rel="stylesheet" href="./css/results/workouts.css">
    <link rel="stylesheet" href="./css/results/nutrition.css">
    <link rel="stylesheet" href="./css/results/recovery.css">
    <link rel="stylesheet" href="./css/results/exercises.css">
    <link rel="stylesheet" href="./css/results/achievements.css">
    <link rel="stylesheet" href="./css/results/calendar.css">
    <link rel="stylesheet" href="./css/results/tables.css">
    <link rel="stylesheet" href="./css/results/charts.css">
    <link rel="stylesheet" href="./css/results/results.css">
    <link rel="stylesheet" href="./css/results/dashboard.css">
    <link rel="stylesheet" href="./css/results/toolkit.css">
    <link rel="stylesheet" href="./css/results/activity.css">
    <link rel="stylesheet" href="./css/results/liveActivity.css">
    <link rel="stylesheet" href="./css/results/planning.css">
    <link rel="stylesheet" href="./css/results/analytics.css">
    <link rel="stylesheet" href="./css/results/accountPro.css">
    <link rel="stylesheet" href="./css/results/achievementsPro.css">


</head>




<body>


<div class="app">



    <!-- =====================================
         HEADER
    ===================================== -->


    <header class="athlos-header">


        <div class="logo">

            ATHLOS

        </div>


        <div class="tagline">

            AI Athlete Coach

        </div>


    </header>







    <!-- =====================================
         ONBOARDING PROGRESS
    ===================================== -->


    <div 
    class="progress-container"
    id="onboarding-progress">


        <div class="progress-track">


            <div
            id="progress-bar"
            class="progress-bar">
            </div>


        </div>



        <p class="progress-text">

            Building your athlete profile

        </p>


    </div>









    <!-- =====================================
         MAIN APPLICATION AREA
    ===================================== -->


    <main class="container">



        <!-- =============================
             ONBOARDING QUESTION CARD
        ============================== -->


        <section 
        class="question-card"
        id="question-section">


            <h1 id="question-title">

                Loading...

            </h1>



            <p id="question-description">

            </p>





            <div
            id="options"
            class="options-container">


            </div>





            <button
            id="next-btn"
            class="next-button">


                Continue


            </button>



        </section>





        <!-- =============================
             RESULTS DASHBOARD
        ============================== -->


        <section
        id="results-section"
        class="athlos-dashboard"
        style="display:none;">



            <div
            id="summary">
            </div>



            <div
            id="calendar">
            </div>



            <div
            id="workouts">
            </div>



            <div
            id="analytics">
            </div>



            <div
            id="nutrition">
            </div>



            <div
            id="recovery">
            </div>



            <div
            id="exercises">
            </div>



            <div
            id="achievements">
            </div>



        </section>



    </main>









    <!-- =====================================
         FOOTER
    ===================================== -->


    <footer class="athlos-footer">


        <p>

            Powered by Athlos AI

        </p>


    </footer>





</div>









<!-- =====================================
     LIBRARIES
===================================== -->


<!-- =====================================
     ATHLOS APPLICATION
===================================== -->


<script
type="module"
src="./js/script.js">
</script>



</body>

</html>
